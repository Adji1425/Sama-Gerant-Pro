{% extends 'base.html' %}
{% block title %}Accueil — Sama-Gérant Pro{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="fw-bold display-5" style="color:#1B263B;">
    🛍️ Sama-Gérant Pro
  </h1>
  <p class="text-muted lead">
    Système de Gestion Commerciale avec Aide à la Décision
  </p>
  <div class="mt-4 d-flex justify-content-center gap-3">
    <a href="{% url 'produits:catalogue' %}"
       class="btn fw-semibold px-4 py-2"
       style="background-color:#E0A458;color:#1B263B;">
      <i class="bi bi-grid me-2"></i>Voir le catalogue
    </a>
    {% if not user.is_authenticated %}
    <a href="{% url 'users:register' %}"
       class="btn fw-semibold px-4 py-2"
       style="background-color:#1B263B;color:white;">
      Créer un compte
    </a>
    {% endif %}
  </div>
</div>
{% endblock %}
