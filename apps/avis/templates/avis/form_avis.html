{% extends 'base.html' %}
{% block title %}Votre avis{% endblock %}
{% block content %}
<h2>Votre avis — {{ produit.nom }}</h2>
<p class="text-muted small">
  <i class="bi bi-shop"></i> Vendu par {{ produit.commercant.nom_boutique }}
</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Publier</button>
</form>
{% endblock %}
