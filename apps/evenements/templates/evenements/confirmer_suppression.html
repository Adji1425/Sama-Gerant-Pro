{% extends 'base.html' %}
{% block title %}Supprimer un événement — Sama-Gérant Pro{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-0 p-4 text-center">
      <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3"></i>
      <h5 class="fw-bold mb-2" style="color:#1B263B;">
        Supprimer « {{ evenement.nom_evenement }} » ?
      </h5>
      <p class="text-muted">
        Cette action est irréversible. L'événement ne déclenchera plus
        d'alertes pour le commerçant.
      </p>
      <form method="POST" class="d-flex justify-content-center gap-2 mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger fw-semibold px-4">
          <i class="bi bi-trash me-1"></i>Supprimer
        </button>
        <a href="{% url 'evenements:liste_evenements' %}"
           class="btn btn-outline-secondary fw-semibold px-4">
          Annuler
        </a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
